<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>トップ画面</title>
</head>

<body>

    <!-- ================= ヘッダー ================= -->
    <header
        style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background-color: #f8f9fa;">
        <!-- ヘッダー左側：商品検索へのリンク -->
        <div class="header-left">
            <a th:href="@{/search}" style="text-decoration: none; font-weight: bold;">商品検索</a>
        </div>

        <!-- ヘッダー右側：ログイン状態による切り替え -->
        <div class="header-right">
            <!-- ログインしている場合 -->
            <!-- ※ Spring Securityの場合は th:if="${#authorization.expr('isAuthenticated()')}" など -->
            <div th:if="${session.loginUser != null}">
                <a th:href="@{/history}" style="margin-right: 15px;">購入履歴</a>
                <a th:href="@{/logout}" style="margin-right: 15px;">ログアウト</a>
                <span th:text="${session.loginUser.customerName + 'さん'}"></span>
            </div>

            <!-- ログインしていない場合（必要に応じて実装） -->
            <div th:if="${session.loginUser == null}">
                <!-- 未ログイン時のヘッダー右側が必要な場合はここに記述 -->
            </div>
        </div>
    </header>

    <!-- ================= メインコンテンツ ================= -->
    <main style="padding: 40px 20px; min-height: 400px;">
        <h1>トップページ</h1>
        <p>ようこそ！お買い物ををお楽しみください。</p>
    </main>

    <!-- ================= フッター ================= -->
    <footer style="padding: 20px; background-color: #f8f9fa; border-top: 1px solid #dee2e6;">
        <nav style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px;">

            <!-- ログインしている場合のフッターメニュー -->
            <th:block th:if="${session.loginUser != null}">
                <div style="font-weight: bold;" th:text="${@environment.getProperty('site.name', 'サイト名')}">サイト名</div>
                <br>
                <a th:href="@{/}">トップ</a><br>
                <a th:href="@{/search}">商品検索</a><br>
                <a th:href="@{/cart}">買い物カゴ</a><br>
                <a th:href="@{/history}">購入履歴</a><br>
                <a th:href="@{/logout}" th:text="|ログアウト（${session.loginUser.customerName}さん）|">ログアウト（顧客名さん）</a><br>
            </th:block>

            <!-- ログインしていない場合のフッターメニュー -->
            <th:block th:if="${session.loginUser == null}">
                <a th:href="@{/}">トップ</a><br>
                <a th:href="@{/register}">アカウント登録</a><br>
                <a th:href="@{/login}">ログイン</a><br>
                <a th:href="@{/search}">商品検索</a><br>
                <a th:href="@{/cart}">買い物カゴ</a>
            </th:block>

        </nav>
    </footer>

</body>

</html>
