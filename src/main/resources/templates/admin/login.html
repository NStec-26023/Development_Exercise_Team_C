<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>ログイン - フルネス文具 管理画面</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>
    <div th:replace="~{admin/fragments/layout :: header}"></div>

    <main class="container">
        <div class="admin-panel p-4 mx-auto" style="max-width: 480px;">
            <h1 class="text-center mb-4">ログイン</h1>

            <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

            <form th:action="@{/admin/login}" th:object="${form}" method="post">

                <div th:if="${param.error}" style="color: red; margin-bottom: 15px;">
                    アカウント名またはパスワードが正しくありません
                </div>

                <div th:if="${param.locked}" style="color: red; margin-bottom: 15px;">
                    アカウントがロックされています。しばらく経ってから再度お試しください
                </div>

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="mb-3">
                    <label class="form-label">アカウント名</label>
                    <input type="text" name="username" class="form-control" th:value="${accountName}" maxlength="20">
                    <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}"
                        style="color: red; font-size: 0.9rem;"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">パスワード</label>
                    <input type="password" name="password" class="form-control" maxlength="20">
                    <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}"
                        style="color: red; font-size: 0.9rem;"></div>
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-fs-solid px-4">ログイン</button>
                </div>
            </form>
        </div>
    </main>

    <div th:replace="~{admin/fragments/layout :: footer}"></div>
</body>

</html>
